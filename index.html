<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Wriggle War</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#3a5c8a" />
  <link rel="icon" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Wriggle War" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; overscroll-behavior: none; }
    body { font-family: Verdana, Geneva, sans-serif; touch-action: none; }
    #view { display: block; width: 100%; height: 100%; image-rendering: pixelated; cursor: crosshair; touch-action: none; }
    #hud {
      position: fixed; left: 8px; top: 8px; color: #dff; font-size: 11px;
      line-height: 1.55; text-shadow: 1px 1px 0 #000; pointer-events: none;
      background: rgba(0,0,0,.35); padding: 6px 9px; border: 1px solid rgba(255,255,255,.15);
      white-space: pre; z-index: 10;
    }
    @media (pointer: coarse) { #hud { display: none; } }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="hud"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
